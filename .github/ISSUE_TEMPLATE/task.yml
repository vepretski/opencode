    id: objective
    attributes:
      label: Objective
      description: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and acceptance criteria
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / blockers
