name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Run ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs/errors
      description: Paste concise logs or screenshots.
      render: shell

  - type: input
    id: version
    attributes:
      label: OpenCode version
      placeholder: e.g. 1.14.48

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. macOS 15, Bun 1.3.13
